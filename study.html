<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disease Study — Bio 40A</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/plates.css">
</head>
<body>

<header>
  <h1 id="disease-title">Loading…</h1>
  <div class="subtitle" id="disease-subtitle"></div>
</header>

<div class="tabs">
  <button class="tab" data-tab="body">Plate I — Body Chart</button>
  <button class="tab" data-tab="histology">Plate II — Histology</button>
  <button class="tab" data-tab="glossary">Glossary — Terms</button>
</div>

<main id="study-root">

  <section class="tab-panel" id="panel-body">
    <div class="layout">
      <div class="panel figure-panel">
        <div class="panel__content">
          <div class="panel__label">Fig. 1 — Regions of Involvement</div>
          <div id="body-chart"></div>
          <div class="legend">
            <div class="legend__item"><span class="legend__swatch legend__swatch--region"></span>REGION</div>
            <div class="legend__item"><span class="legend__swatch legend__swatch--hover"></span>HOVER</div>
            <div class="legend__item"><span class="legend__swatch legend__swatch--active"></span>SELECTED</div>
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="controls"></div>
        <div class="panel info-panel">
          <div class="panel__content" id="info-panel"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="panel-histology">
    <div id="histology"></div>
  </section>

  <section class="tab-panel" id="panel-glossary">
    <div id="glossary"></div>
  </section>

</main>

<div id="modal-root"></div>

<div class="footer-note">
  D. Sheffield · Bio 40A · <a href="index.html" style="color: var(--muted);">Disease Index</a> · Public Domain Plates from Gray's Anatomy (1918)
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
